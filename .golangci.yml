version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - cyclop
    - dogsled
    - errcheck
    - errname
    - gochecknoinits
    - gocognit
    - gosec
    - govet
    - ineffassign
    - makezero
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    cyclop:
      max-complexity: 30
      package-average: 0
    gocognit:
      min-complexity: 30
    revive:
      rules:
        - name: var-naming
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - cyclop
          - gocognit
        path: _test\.go
      - linters:
          - cyclop
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      - tmp/
formatters:
  enable:
    - gofmt
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - tmp/
run:
  build-tags:
    - integration